<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="_ds/al-akhyar-design-system-31b8dacc-ca28-410f-82b9-62b552c579c3/tokens/fonts.css">
  <link rel="stylesheet" href="_ds/al-akhyar-design-system-31b8dacc-ca28-410f-82b9-62b552c579c3/tokens/colors.css">
</helmet>
<div style="position:sticky; top:0; z-index:50; background:#fff; border-bottom:1px solid #E1E7ED;">
  <div style="max-width:1180px; margin:0 auto; padding:16px 24px 12px 24px; display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap;">
    <a href="kurikulum-web-beranda.dc.html" style="display:flex; align-items:center; gap:10px; text-decoration:none;">
      <img src="assets/logo-sekolah.png" alt="Logo Sekolah Islam Al Akhyar" style="height:34px; width:auto;">
      <div>
        <div style="font-family:'Poppins',sans-serif; font-weight:800; font-size:13.5px; color:#004268; line-height:1.2;">Kurikulum Unggul &amp; Berakhlak</div>
        <div style="font-size:10.5px; color:#6B7683;">Al Akhyar Islamic School</div>
      </div>
    </a>
    <a href="kurikulum-web-beranda.dc.html" style="font-size:12.5px; font-weight:700; color:#006195; text-decoration:none; padding:8px 16px; border:1.5px solid #006195; border-radius:999px; flex-shrink:0;">← Beranda</a>
  </div>
  <div style="max-width:1180px; margin:0 auto; padding:0 24px 14px 24px; display:flex; gap:8px; overflow-x:auto;">
    <sc-for list="{{ chapters }}" as="c" hint-placeholder-count="13">
      <a href="{{ c.file }}" style="flex-shrink:0; display:flex; align-items:center; gap:6px; padding:7px 13px; border-radius:999px; text-decoration:none; white-space:nowrap; background:{{ c.bg }};">
        <span style="font-family:'Plus Jakarta Sans',sans-serif; font-size:10px; font-weight:800; color:{{ c.fg }}; opacity:0.7;">{{ c.roman }}</span>
        <span style="font-family:'Plus Jakarta Sans',sans-serif; font-size:11.5px; font-weight:700; color:{{ c.fg }};">{{ c.title }}</span>
      </a>
    </sc-for>
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;active&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:1,&quot;tsType&quot;:&quot;number&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const list = [
      {n:1, roman:'I', title:'Pendahuluan', file:'kurikulum-web-bab-01-pendahuluan.dc.html', color:'#006195'},
      {n:2, roman:'II', title:'Profil Lulusan', file:'kurikulum-web-bab-02-profil-lulusan.dc.html', color:'#EC2A6B'},
      {n:3, roman:'III', title:'Struktur Kurikulum', file:'kurikulum-web-bab-03-struktur-kurikulum.dc.html', color:'#006195'},
      {n:4, roman:'IV', title:'Pengorganisasian', file:'kurikulum-web-bab-04-pengorganisasian.dc.html', color:'#1B93C6'},
      {n:5, roman:'V', title:'Program & Kalender', file:'kurikulum-web-bab-05-program-kalender.dc.html', color:'#E8493F'},
      {n:6, roman:'VI', title:'Tahfidz & Hadits', file:'kurikulum-web-bab-06-tahfidz-hadits.dc.html', color:'#218A62'},
      {n:7, roman:'VII', title:'Poinku', file:'kurikulum-web-bab-07-poinku.dc.html', color:'#B9790C'},
      {n:8, roman:'VIII', title:'Dinar App', file:'kurikulum-web-bab-08-dinar-app.dc.html', color:'#1B93C6'},
      {n:9, roman:'IX', title:'Perencanaan', file:'kurikulum-web-bab-09-perencanaan-pembelajaran.dc.html', color:'#006195'},
      {n:10, roman:'X', title:'Asesmen', file:'kurikulum-web-bab-10-asesmen-evaluasi.dc.html', color:'#EC2A6B'},
      {n:11, roman:'XI', title:'Evaluasi Kurikulum', file:'kurikulum-web-bab-11-evaluasi-kurikulum.dc.html', color:'#218A62'},
      {n:12, roman:'XII', title:'Tata Tertib', file:'kurikulum-web-bab-12-tata-tertib.dc.html', color:'#B9790C'},
      {n:13, roman:'XIII', title:'Penutup', file:'kurikulum-web-bab-13-penutup.dc.html', color:'#1B93C6'},
    ];
    const active = Number(this.props.active);
    const chapters = list.map(c => ({...c, bg: c.n === active ? c.color : '#F5F8FA', fg: c.n === active ? '#fff' : '#3F4B55'}));
    return { chapters };
  }
}
</script>
</body>
</html>
